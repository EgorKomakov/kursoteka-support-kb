name: Синхронизация базы знаний KCS

on:
  issues:
    types: [opened, edited, closed, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: bookstack-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync:
    name: Создание или обновление статьи
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'knowledge')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Установка зависимостей
        working-directory: .github/scripts
        run: npm install
      - name: Синхронизация статьи в BookStack
        env:
          BOOKSTACK_URL: ${{ secrets.BOOKSTACK_URL }}
          BOOKSTACK_API_ID: ${{ secrets.BOOKSTACK_API_ID }}
          BOOKSTACK_API_SECRET: ${{ secrets.BOOKSTACK_API_SECRET }}
          BOOKSTACK_BOOK_ID: ${{ secrets.BOOKSTACK_BOOK_ID }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_UPDATED_AT: ${{ github.event.issue.updated_at }}
          EVENT_ACTION: ${{ github.event.action }}
        run: node .github/scripts/sync-page.js